<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang chuyển tới trang quản trị</title>

  <!--
    Chặn mọi công cụ tìm kiếm ở mức trang. CỐ Ý không khai gì trong robots.txt:
    robots.txt là file công khai, thêm "Disallow: /admin" vào đó chẳng khác nào
    dựng biển chỉ đường tới chỗ mình muốn giấu.
  -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">

  <!-- Chuyển hướng cho cả trường hợp trình duyệt tắt JavaScript -->
  <meta http-equiv="refresh" content="2; url=https://script.google.com/macros/s/AKfycbxmvdyg_WUQ2MrSjO-TfGrKf4mMltXTt8VsYZs1JVX7oU0Id5cw92wtAcufZ2h46LYuvg/exec">

  <link rel="shortcut icon" href="./favicon.png">
  <style>
    :root { --brand: #c63b3c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f5f6f8; padding: 20px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #22262b;
    }
    .card {
      background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
      padding: 40px 36px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 2px 10px rgb(0 0 0 / .04);
    }
    .card img { width: 180px; height: auto; margin-bottom: 24px; }
    h1 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
    p { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    .spinner {
      width: 30px; height: 30px; margin: 0 auto 22px;
      border: 3px solid #e3e6ea; border-top-color: var(--brand);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    a.go {
      display: inline-block; padding: 10px 20px; border-radius: 6px;
      background: var(--brand); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
    }
    a.go:hover { filter: brightness(1.08); }
    .hint { font-size: 12px; color: #9ca3af; margin: 18px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <img src="./logo.png" alt="Luật Đông Hà Nội">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Đang chuyển tới trang quản trị website…</h1>
    <p>Vui lòng đợi trong giây lát. Nếu trình duyệt không tự chuyển, bấm nút bên dưới.</p>
    <a class="go" id="go"
       href="https://script.google.com/macros/s/AKfycbxmvdyg_WUQ2MrSjO-TfGrKf4mMltXTt8VsYZs1JVX7oU0Id5cw92wtAcufZ2h46LYuvg/exec"
       rel="nofollow noreferrer">Vào trang quản trị</a>
    <p class="hint">Trang dành riêng cho quản trị viên.</p>
  </main>

  <script>
    // location.replace chứ không phải location.href: không để lại trang này
    // trong lịch sử, nên bấm Back từ CMS sẽ về đúng trang trước đó thay vì
    // rơi lại vào màn hình chuyển hướng rồi bị đẩy đi tiếp.
    setTimeout(function () {
      location.replace(document.getElementById('go').href);
    }, 1200);
  </script>
</body>
</html>

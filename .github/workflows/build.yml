name: Build site tĩnh

# Chỉ chạy khi data/posts.json đổi — KHÔNG phải data/**.
#
# Lý do: mỗi thao tác Lưu/Xoá của CMS tạo nhiều commit liên tiếp (ảnh →
# detail.json → posts.json). Trigger theo cả thư mục sẽ chạy ngay từ commit đầu,
# lúc index tổng chưa cập nhật → deploy nhầm bản dở dang. posts.json luôn là
# commit CHỐT của mọi thao tác nên đây là mốc duy nhất đúng.
on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'data/redirects.json'
      - 'templates/**'
      - 'scripts/build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py chỉ dùng thư viện chuẩn — không có bước cài dependency nào.
      - name: Kiểm tra dữ liệu
        run: python3 scripts/build.py --check

      - name: Build
        run: python3 scripts/build.py

      - name: Commit kết quả
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/
          if git diff --cached --quiet; then
            echo "Không có thay đổi nào trong html/ — bỏ qua commit."
            exit 0
          fi
          git commit -m "CI: build html from data"
          git push
          # Commit này chỉ đụng html/, không đụng data/ → không tự kích hoạt lại
          # chính workflow này. (GITHUB_TOKEN cũng không được phép trigger workflow.)
